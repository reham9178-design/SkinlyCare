  <body>
    <div id="navbar"></div>

    <section class="product-detail">
      <div class="container-narrow">
        <div class="row g-5 reveal-section">
          <div class="col-12 col-md-6">
            <div class="product-gallery-main" id="galleryViewport">
              <div class="product-mainImage" id="mainImage"></div>
            </div>

            <div class="product-thumbs-viewport">
              <div class="product-thumbs" id="thumbsRow"></div>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <span class="pill-badge">
              <i class="fa-brands fa-envira"></i>
              Product Detail
            </span>

            <div class="product-price" id="pdPrice"></div>

            <h1 class="product-title" id="pdTitle"></h1>

            <p class="product-description" id="pdDescription"></p>

            <div class="product-rating">
              <span class="stars">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
              </span>

              <span id="pdRating"></span>
            </div>

            <div class="pd-actions-row">
              <button class="btn-buy" type="button">
                Add to Cart <i class="fa-solid fa-bag-shopping"></i>
              </button>
              <!-- wishlist button -->
              <button type="button" id="pdWishlistBtn" class="pd-wishlist-btn">
                <i class="fa-regular fa-heart"></i>
              </button>
            </div>

            <div class="product-details" id="productDetails"></div>
          </div>
        </div>
      </div>
    </section>
    <section class="summary-section reveal-section">
      <div class="container-narrow">
        <h2>Summary</h2>

        <div id="pdSummary"></div>
      </div>
    </section>

    <section class="related-section">
      <div class="container-narrow reveal-section">
        <h2>Related Products</h2>

        <div class="row reveal-section" id="relatedRow"></div>
      </div>
    </section>

    <div id="site-components"></div>

    <a href="#" class="scroll-top-btn">
      <i class="fa-solid fa-arrow-up-long"></i>
    </a>

    <script src="./assets/js/footer.js"></script>
