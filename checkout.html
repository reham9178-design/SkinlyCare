<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="assets/css/navBar.css" />
    <link rel="stylesheet" href="assets/css/footer.css" />
    <link rel="stylesheet" href="assets/css/btnUP.css" />
    <link rel="stylesheet" href="assets/css/product.css" />
    <link rel="stylesheet" href="assets/css/checkout.css" />
  </head>
  <body>
    <div id="navbar"></div>

    <section class="hero">
      <div class="container-narrow">
        <h1>Checkout</h1>
      </div>
    </section>

    <section class="checkout-section">
      <div class="container-narrow checkout-grid">
        <!-- Shipping Form -->
        <div class="checkout-form-card">
          <h2>Shipping Details</h2>

          <form id="checkoutForm" onsubmit="placeOrder(event)" novalidate>
            <div class="form-group">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" placeholder="Jane Smith" />
              <span class="error-message" id="fullNameError"></span>
            </div>

            <div class="form-group">
              <label for="address">Address</label>
              <input type="text" id="address" placeholder="123 Main Street" />
              <span class="error-message" id="addressError"></span>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" placeholder="Cairo" />
                <span class="error-message" id="cityError"></span>
              </div>
              <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="+20 123 456 789" />
                <span class="error-message" id="phoneError"></span>
              </div>
            </div>

            <button type="submit" class="btn-buy">Place Order</button>
          </form>

          <div id="orderSuccess" class="order-success" style="display: none">
            <i class="fa-solid fa-circle-check"></i>
            <h3>Thank you! Your order has been placed.</h3>
            <a href="product.html">Continue Shopping</a>
          </div>
        </div>

        <!-- Order Summary -->
        <div class="checkout-summary-card">
          <h2>Order Summary</h2>
          <div id="checkoutItems"></div>
          <div class="checkout-total-row">
            <span>Total</span>
            <span id="checkoutTotal">$0.00</span>
          </div>
        </div>
      </div>
    </section>
    <div id="site-components"></div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/wishlist.js"></script>
    <script src="assets/js/navBar.js"></script>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/checkoutPage.js"></script>
    <script src="assets/js/btnUP.js"></script>
  </body>
</html>
