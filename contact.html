  <body>
    <div id="navbar"></div>
    <section class="contact-section" id="contact-us">
      <div class="contact-header reveal-section">
        <div class="frame">
          <i class="fa-brands fa-envira"></i>
          <p>Contact us</p>
        </div>

        <h1 class="contact-main-title">
          <span>Let's Talk About</span>
          <span>Your Skin</span>
        </h1>

        <p class="contact-subtitle">
          Get expert skincare guidance and discover<br />
          the path to healthy, glowing skin.
        </p>
      </div>

      <div class="contact-grid">
        <div class="contact-info-list reveal-section">
          
          <div class="contact-info-card">
            <div class="contact-icon-box">
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                />
                <polyline points="22,6 12,13 2,6" />
              </svg>
            </div>
            <h3>Email Address:</h3>
            <p>riham Abdelnasserlikhan090@gmail.com</p>
          </div>

          <div class="contact-info-card">
            <div class="contact-icon-box">
              <i class="fa-solid fa-mobile-screen-button"></i>
            </div>
            <h3>Phone Number:</h3>
            <p>+92 123 456 789</p>
          </div>

          <div class="contact-info-card">
            <div class="contact-icon-box">
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                <circle cx="12" cy="10" r="3" />
              </svg>
            </div>
            <h3>Location:</h3>
            <p>Sydney, NSW, Australia</p>
          </div>
        </div>
        <div class="contact-form-card reveal-section">
          <form id="contactForm">
            <div class="form-row">
              <div class="form-group">
                <label for="firstName">Name</label>
                <input
                  type="text"
                  id="firstName"
                  placeholder="First Name"
                  required
                />
              </div>

              <div class="form-group">
                <label for="lastName">Last Name</label>
                <input
                  type="text"
                  id="lastName"
                  placeholder="Last Name"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label for="contactEmail">Email</label>
              <input
                type="email"
                id="contactEmail"
                placeholder="email@gmail.com"
                required
              />
            </div>

            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input
                type="tel"
                id="phone"
                placeholder="+20 123 456 ...."
                required
              />
            </div>

            <div class="form-group">
              <label for="message">Message</label>
              <textarea
                id="message"
                rows="4"
                placeholder="Write your message here.."
                required
              ></textarea>
            </div>

            <button type="submit" class="contact-submit-btn">Submit</button>
          </form>
        </div>
      </div>
    </section>
    <div id="site-components"></div>
